[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "water"
version = "0.1.0"
description = "A lightweight WebAssembly Text Format parser and emitter written in Python."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "water contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
water = "water.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["water*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
